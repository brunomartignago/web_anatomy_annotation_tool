[project]
name = "annotool"
version = "0.1.0"
description = "Annotate web page screenshots with a multi-axis UI taxonomy (Form × Function × Component × Template section)."
license = "MIT"
authors = [{ name = "Bruno Martignago" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pillow>=10.4",
    "playwright>=1.47",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/brunomartignago/web_anatomy_annotation_tool"
Research = "https://brunomartignago.github.io/pages/research1.html"

[project.scripts]
annotool = "annotool.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.23",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
